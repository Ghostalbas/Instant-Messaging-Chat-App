<div class="message-input-container">
    <div class="input-wrapper">
        <button class="action-btn" (click)="toggleEmojiPicker()" title="Insert emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                <line x1="9" y1="9" x2="9.01" y2="9" />
                <line x1="15" y1="9" x2="15.01" y2="9" />
            </svg>
        </button>

        @if (showEmojiPicker) {
        <div class="emoji-picker-wrapper">
            <app-emoji-picker (emojiSelected)="onEmojiSelect($event)"></app-emoji-picker>
        </div>
        }

        <textarea [(ngModel)]="message" (keydown)="onKeydown($event)" (input)="onInput()"
            placeholder="Type a message..." rows="1"></textarea>

        <button class="send-btn" (click)="onSend()" [disabled]="!message.trim()" title="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13" />
                <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
        </button>
    </div>

    <p class="hint">Press Enter to send, Shift+Enter for new line</p>
</div>
